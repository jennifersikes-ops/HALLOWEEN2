<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Last Waltz at Bluebonnet Manor: A Halloween Mystery</title>
<style>
:root{
  --dusk:#1b1027; --dusk2:#2a1840; --panel:#241635; --line:#4a3366;
  --paper:#f1e6cc; --paper2:#e6d8b8; --ink:#2b2233; --inkSoft:#5a4d63;
  --pumpkin:#e8761a; --pumpkinDeep:#b85608; --stamp:#b3261e; --moss:#2f7d4f; --gold:#f2c14e; --cream:#f4ecde; --mute:#bba9cf;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--dusk) radial-gradient(1100px 480px at 75% -8%, #3b2359 0%, transparent 62%) no-repeat;
  color:var(--cream);
  font:17px/1.55 "Trebuchet MS","Segoe UI",system-ui,sans-serif;
  min-height:100vh;
}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .5em}
a{color:var(--gold)}
button{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* header */
.top{max-width:1180px;margin:0 auto;padding:18px 18px 6px;display:flex;gap:18px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.brand h1{font-size:clamp(24px,4vw,36px);font-style:italic;letter-spacing:.01em;text-shadow:0 2px 0 #0007}
.brand p{margin:0;color:var(--mute);font-size:15px}
.meter{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pumpkin);display:block;background:transparent}
.dots i.on{background:var(--pumpkin)}
.dots i.now{box-shadow:0 0 0 3px #e8761a55}
.miss{font-size:15px;color:var(--mute)}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:12px 18px 40px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;align-items:start}
body[data-stage="intro"] .wrap{grid-template-columns:minmax(0,1fr)}
body[data-stage="intro"] #board{display:none}
@media (max-width:920px){.wrap{grid-template-columns:minmax(0,1fr)}}

/* paper (case file) */
.paper{background:var(--paper);color:var(--ink);border-radius:3px;padding:22px 26px;box-shadow:0 3px 0 #0006;font-family:Georgia,"Times New Roman",serif;font-size:18px;line-height:1.6;margin-bottom:18px}
.paper h2{font-size:26px}
.paper h3{font-size:20px;margin-top:1.1em}
.paper p{margin:.6em 0}
.paper .sans{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
.tag{display:inline-block;background:var(--ink);color:var(--paper);border-radius:3px;padding:1px 10px;font:700 15px "Trebuchet MS",system-ui,sans-serif;margin-right:8px;vertical-align:middle}
.note{background:#fff7da;border-left:5px solid var(--pumpkin);padding:8px 14px;margin:12px 0;font-size:17px}

table.tbl{border-collapse:collapse;width:100%;font-size:16px;margin:10px 0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
.tbl th,.tbl td{border:1px solid #b9a97f;padding:6px 10px;text-align:left}
.tbl th{background:var(--paper2)}
.scroll{overflow-x:auto}

/* buttons */
.btn{background:var(--pumpkin);color:#1b0f06;border:0;border-radius:6px;padding:11px 20px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--pumpkinDeep)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pumpkinDeep)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}

/* questions */
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--inkSoft);font:15px "Trebuchet MS",system-ui,sans-serif;margin-bottom:6px}
.qtext{font-size:20px;font-weight:700;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;background:#fffaf0;color:var(--ink);border:2px solid #b9a97f;border-radius:6px;padding:11px 14px;cursor:pointer;font:17px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
.opt:hover:not([disabled]){border-color:var(--pumpkin);background:#fff1d6}
.opt.right{background:#d8f0df;border-color:var(--moss);font-weight:700}
.opt.wrong{background:#f7d9d6;border-color:var(--stamp);text-decoration:line-through;opacity:.75}
.opt[disabled]{cursor:default}
.feedback{margin-top:14px;padding:12px 16px;border-radius:6px;font:16px/1.5 "Trebuchet MS",system-ui,sans-serif}
.feedback.good{background:#d8f0df;border-left:6px solid var(--moss)}
.feedback.bad{background:#f7d9d6;border-left:6px solid var(--stamp)}
.seq{display:flex;gap:8px;flex-wrap:wrap;min-height:48px;margin:8px 0;padding:8px;border:2px dashed #b9a97f;border-radius:6px;background:#fffaf0;font-family:"Trebuchet MS",system-ui,sans-serif}
.seq .chip{background:var(--ink);color:var(--paper);padding:6px 12px;border-radius:20px}
.seq .ph{color:var(--inkSoft);padding:6px 4px}
.pool{display:flex;gap:10px;flex-wrap:wrap}
.pool .opt{width:auto}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}

/* graphics */
svg.chart{width:100%;height:auto;max-width:680px;display:block;margin:8px auto;background:#fffaf0;border:1px solid #b9a97f;border-radius:4px}
.chart .grid{stroke:#d9ccaa;stroke-width:1}
.chart .gridM{stroke:#ece2c8;stroke-width:1}
.chart .axis{stroke:#2b2233;stroke-width:2}
.chart text{font:12px "Trebuchet MS",system-ui,sans-serif;fill:#2b2233}
.chart .lbl{font-size:14px;font-weight:700}

/* board */
#board{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;position:sticky;top:12px}
#board h2{font-size:22px;margin-bottom:10px}
.sus{position:relative;background:var(--paper);color:var(--ink);border-radius:3px;padding:10px 12px;margin-bottom:10px;font:15px/1.4 "Trebuchet MS",system-ui,sans-serif;border-left:6px solid #8f7fa3}
.sus b{font-family:Georgia,serif;font-size:17px}
.sus small{display:block;color:var(--inkSoft)}
.sus.prime{border-left-color:var(--pumpkin);background:#ffe8c4}
.sus.cleared{border-left-color:var(--moss);opacity:.82}
.sus.cleared b{text-decoration:line-through;text-decoration-thickness:2px}
.stamp{position:absolute;right:8px;top:10px;transform:rotate(-9deg);border:3px solid var(--stamp);color:var(--stamp);font:800 15px "Trebuchet MS",system-ui,sans-serif;letter-spacing:.06em;padding:0 8px;border-radius:4px;background:#f1e6ccdd;animation:slam .35s ease-out}
@keyframes slam{from{transform:scale(2.4) rotate(-9deg);opacity:0}to{transform:scale(1) rotate(-9deg);opacity:1}}
.why{display:block;margin-top:4px;color:var(--ink)}

/* suspect statements */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:10px}
.card{background:#fffaf0;border:1px solid #b9a97f;border-radius:4px;padding:12px 14px;font:16px/1.45 "Trebuchet MS",system-ui,sans-serif}
.card b{font-family:Georgia,serif;font-size:18px}
.card q{display:block;margin-top:6px;font-family:Georgia,serif;font-style:italic;quotes:"“" "”"}

.pick{display:grid;gap:10px;margin:12px 0}
.pick .opt[aria-pressed="true"]{border-color:var(--pumpkin);background:#ffe8c4;font-weight:700}
input[type=text]{font:inherit;padding:10px 12px;border-radius:6px;border:2px solid #b9a97f;background:#fffaf0;color:var(--ink);width:100%;max-width:360px}
textarea{width:100%;min-height:150px;font:16px/1.5 "Trebuchet MS",system-ui,sans-serif;padding:10px 12px;border-radius:6px;border:2px solid #b9a97f;background:#fffaf0;color:var(--ink)}
.foot{max-width:1180px;margin:0 auto;padding:0 18px 30px;color:var(--mute);font-size:14px}
.foot button{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:14px;padding:0}
#cerPrint{display:none}

@media (prefers-reduced-motion:reduce){.stamp,.shake{animation:none}}

@media print{
  body{background:#fff !important;color:#000}
  .top .meter,.row,#board,.foot,.btn,#cer{display:none !important}
  .wrap{display:block;padding:0}
  .paper{box-shadow:none;border:1px solid #999;background:#fff;break-inside:avoid}
  #cerPrint{display:block;white-space:pre-wrap;border:1px solid #999;padding:10px;font:15px/1.5 Georgia,serif}
  .brand p{color:#000}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>The Last Waltz at Bluebonnet Manor</h1>
    <p>A Halloween murder mystery set in Calavera Springs, Texas</p>
  </div>
  <div class="meter" id="meter"></div>
</header>
<main class="wrap">
  <section id="app" aria-live="polite"></section>
  <aside id="board" aria-label="Suspect board"></aside>
</main>
<div class="foot"><button id="reset" type="button">Start a new case (clears saved progress)</button></div>
<script>
"use strict";

/* ============================================================
   DATA: The Last Waltz at Bluebonnet Manor
   ============================================================ */
const SUSPECTS = [
  {id:"seraphina", name:"Lady Seraphina Black", role:"Ambrose’s cousin, dressed as a vampire", emoji:"🦇",
   claim:"In the ballroom, dancing and posing in the photo booth.",
   say:"I was in the ballroom the whole time. There are photo strips of me to prove it!"},
  {id:"rosie", name:"Rosie Ortega", role:"The caterer, dressed as a skeleton", emoji:"💀",
   claim:"In the kitchen plating desserts.",
   say:"I was in the kitchen plating desserts. Ask the oven, it keeps track!"},
  {id:"barnaby", name:"Professor Barnaby Finch", role:"Family historian, dressed as a mummy", emoji:"📜",
   claim:"Alone in the garden, looking at the moon.",
   say:"I was in the garden looking at the moon. Alone, I’m afraid. I am not much for parties."},
  {id:"wyatt", name:"Wyatt Calloway", role:"The groundskeeper, dressed as a werewolf", emoji:"🐺",
   claim:"Locking the front gate.",
   say:"I was locking the front gate for the night, like I do every Halloween."},
  {id:"penny", name:"Penny Quill", role:"Ambrose’s assistant, dressed as a witch", emoji:"🧙",
   claim:"Running the music in the ballroom.",
   say:"I was running the music in the ballroom, same as every year."}
];

function mapSvg(){
  const N=[{k:"lib",x:280,y:150,t:"Library",c:"#f2c14e"},{k:"ball",x:95,y:55,t:"Ballroom"},{k:"kit",x:95,y:245,t:"Kitchen"},{k:"gate",x:465,y:55,t:"Front gate"},{k:"gar",x:465,y:245,t:"Garden"}];
  const E=[["ball","2 min"],["kit","4 min"],["gate","5 min"],["gar","3 min"]];
  const g=k=>N.find(n=>n.k===k);
  let s=`<svg class="chart" viewBox="0 0 560 300" role="img" aria-label="Map of Bluebonnet Manor. Walking time to the library: from the ballroom 2 minutes, from the kitchen 4 minutes, from the front gate 5 minutes, from the garden 3 minutes">`;
  E.forEach(e=>{const n=g(e[0]);s+=`<line x1="280" y1="150" x2="${n.x}" y2="${n.y}" stroke="#2b2233" stroke-width="3" stroke-dasharray="8 6"/>`});
  E.forEach(e=>{const n=g(e[0]);const mx=(280+n.x)/2,my=(150+n.y)/2;s+=`<rect x="${mx-30}" y="${my-14}" width="60" height="26" rx="5" fill="#fffaf0" stroke="#2b2233"/><text x="${mx}" y="${my+5}" text-anchor="middle" class="lbl">${e[1]}</text>`});
  N.forEach(n=>{s+=`<rect x="${n.x-58}" y="${n.y-22}" width="116" height="44" rx="6" fill="${n.c||"#e6d8b8"}" stroke="#2b2233" stroke-width="3"/><text x="${n.x}" y="${n.y+5}" text-anchor="middle" class="lbl">${n.t}</text>`});
  s+=`<text x="280" y="294" text-anchor="middle">Walking time from each place to the library</text></svg>`;
  return s;
}
function cipherStrip(){
  const A="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  let top="",bot="";
  for(let i=0;i<26;i++){top+=`<td>${A[i]}</td>`;bot+=`<td><b>${A[(i+23)%26]}</b></td>`}
  return `<div class="scroll"><table class="tbl" style="text-align:center"><tr><th>Coded letter</th>${top}</tr><tr><th>Real letter</th>${bot}</tr></table></div>`;
}

const STATIONS = [
{
 n:1, icon:"🕰️", title:"The Stopped Clock", skill:"Time logic",
 brief:`<p>Marisol the maid found Ambrose Hollowell in the library at <b>9:20 PM</b>. On the floor lay the library’s old clock, smashed, with its hands stopped. Every good case starts with one question: <b>when did it happen?</b></p>`,
 evidence:()=>`<div class="note"><b>Evidence:</b> The smashed library clock shows <b>9:15</b>.<br><b>Housekeeper’s note:</b> “Every clock in the manor is right, except the library clock. It runs <b>10 minutes fast</b>.”<br><b>Marisol’s phone</b> (correct time) says she found the body at <b>9:20 PM</b>.</div>`,
 qs:[
  {q:"The smashed library clock stopped at 9:15, and it runs 10 minutes fast. What was the real time when it stopped?",
   opts:["9:05 PM","9:25 PM","9:15 PM","8:55 PM"],a:0,
   hint:"A fast clock shows a time that is later than the real time. So the real time must be earlier.",
   explain:"A clock that runs 10 minutes fast shows 9:15 when it is really 9:05."},
  {q:"Marisol found Ambrose at 9:20 PM (real time). How many minutes passed between the clock stopping and Marisol finding him?",
   opts:["15 minutes","5 minutes","25 minutes","35 minutes"],a:0,
   hint:"Use the real time the clock stopped, not the time it showed.",
   explain:"From 9:05 to 9:20 is 15 minutes."},
  {q:"A suspect says, “I was dancing in the ballroom at 9:15, so it can’t be me.” Why does this alibi NOT clear the suspect?",
   opts:["The crime happened at 9:05, so an alibi has to cover 9:05, not 9:15","The ballroom is too far from the library","Dancing is never a good alibi","9:15 is too late in the evening"],a:0,
   hint:"An alibi only helps if it covers the moment the crime happened.",
   explain:"The crime happened at 9:05 real time. An alibi for 9:15 says nothing about where the person was at 9:05."}
 ],
 reveal:{title:"Case note: the real time",
  html:`<p>The clock lied by ten minutes. <b>The killer was in the library at 9:05 PM.</b> Any alibi has to cover 9:05. Sheriff Salazar has locked the doors. No one is leaving.</p>`,
  clear:[]},
 proof:"The library clock runs 10 minutes fast, so it stopped at 9:05 real time. The killer was in the library at 9:05."
},
{
 n:2, icon:"🗺️", title:"The Alibi Check", skill:"Alibi math",
 brief:`<p>Two suspects left trails that the sheriff trusts, because their clocks are correct. Use the map. If someone was far away from the library at one time and again a few minutes later, you can work out whether they had enough time to get to the library at 9:05.</p>`,
 evidence:()=>`${mapSvg()}<div class="scroll"><table class="tbl"><tr><th>Suspect</th><th>Record (correct clock)</th><th>Times</th></tr>
 <tr><td>Rosie</td><td>Oven log: door opened in the kitchen</td><td>9:03 PM and 9:07 PM</td></tr>
 <tr><td>Wyatt</td><td>Gate camera: he is standing at the front gate</td><td>9:02 PM and 9:08 PM</td></tr>
 <tr><td>Barnaby</td><td>No records. Alone in the garden.</td><td>None</td></tr></table></div>`,
 qs:[
  {q:"Rosie opened the oven at 9:03 PM and again at 9:07 PM. The kitchen is 4 minutes from the library. Could she have been in the library at 9:05?",
   opts:["No. At 9:03 she was in the kitchen, and the library is 4 minutes away, so she could not be there by 9:05","Yes. She could have run there and back in 2 minutes","Yes. Four minutes is plenty of time","No, because ovens cannot be opened twice"],a:0,
   hint:"If she was in the kitchen at 9:03, what is the earliest time she could reach the library?",
   explain:"Leaving the kitchen at 9:03 she would reach the library at 9:07 at the earliest. She could not be there at 9:05."},
  {q:"The gate camera shows Wyatt at the front gate at 9:02 PM and 9:08 PM. The gate is 5 minutes from the library. Could he have been in the library at 9:05?",
   opts:["No. From the gate he needed 5 minutes to reach the library, so the earliest he could arrive was 9:07","Yes. He could have been there and back by 9:08","Yes. Werewolves are fast","No, because the camera was broken"],a:0,
   hint:"Start from where he was at 9:02 and add the walking time.",
   explain:"Leaving the gate at 9:02, Wyatt reaches the library at 9:07 at the earliest, which is too late for 9:05."},
  {q:"Barnaby was alone in the garden, 3 minutes from the library. No camera or person saw him. What can we say?",
   opts:["His alibi can’t be checked, so he is still a suspect","He is cleared, because the garden is far away","He is guilty, because he has no alibi","He is cleared, because he said he was in the garden"],a:0,
   hint:"No proof that someone was elsewhere is not the same as proof that they did it.",
   explain:"With no record, Barnaby’s alibi cannot be confirmed or broken. He stays on the list, but having no alibi is not proof of guilt."}
 ],
 reveal:{title:"Case note: two alibis hold up",
  html:`<p>Rosie and Wyatt could not have reached the library by 9:05. <b>Three suspects remain: Seraphina, Barnaby, and Penny.</b></p>`,
  clear:[{id:"rosie",why:"Oven log: in the kitchen at 9:03, and the library is 4 minutes away."},{id:"wyatt",why:"Gate camera: at the gate at 9:02, and the library is 5 minutes away."}]},
 proof:"Rosie was in the kitchen at 9:03 (4 minutes away) and Wyatt was at the gate at 9:02 (5 minutes away), so neither could be in the library at 9:05."
},
{
 n:3, icon:"📸", title:"Two Clocks Don’t Agree", skill:"Checking the clocks",
 brief:`<p>Two more alibis need checking. Penny says she was running the music. Seraphina says she was in the ballroom, and she has photo strips. But Marisol warns that <b>not every clock in the manor tells the truth</b>. A detective always checks the clock before trusting the time.</p>`,
 evidence:()=>`<div class="scroll"><table class="tbl"><tr><th>Suspect</th><th>Record</th><th>Time shown</th></tr>
 <tr><td>Penny</td><td>DJ touchscreen log: she tapped to change the song (the screen’s clock is correct)</td><td>9:04 PM and 9:06 PM</td></tr>
 <tr><td>Seraphina</td><td>Photo booth strip: she is in two photos</td><td>9:04 PM and 9:07 PM (booth’s own clock)</td></tr></table></div>
 <div class="note"><b>Repair ticket found inside the photo booth:</b> “Clock reset error. This booth runs <b>10 minutes slow</b>.”<br>The ballroom is <b>2 minutes</b> from the library.</div>`,
 qs:[
  {q:"Penny tapped the DJ screen at 9:04 PM and 9:06 PM. The ballroom is 2 minutes from the library. Could she have been in the library at 9:05?",
   opts:["No. She was at the screen at 9:04 and 9:06. A round trip to the library takes 4 minutes","Yes. She could get there in 2 minutes and still tap again","Yes. The log only shows when the music changed","No. Witches cannot walk through halls"],a:0,
   hint:"To be in the library at 9:05 she would have to leave the ballroom at 9:03 and could not be back until 9:07.",
   explain:"She tapped the screen at 9:04 and again at 9:06. A round trip to the library and back takes 4 minutes, but only 2 minutes passed, so she could not have been there at 9:05."},
  {q:"The photo booth clock runs 10 minutes slow. It stamped Seraphina’s photos 9:04 PM and 9:07 PM. What were the real times?",
   opts:["9:14 PM and 9:17 PM","8:54 PM and 8:57 PM","9:04 PM and 9:07 PM","9:24 PM and 9:27 PM"],a:0,
   hint:"A slow clock shows a time that is earlier than the real time. Add the 10 minutes back.",
   explain:"A slow clock shows too early a time. Add 10 minutes: 9:04 becomes 9:14 and 9:07 becomes 9:17."},
  {q:"Does the photo booth alibi clear Seraphina for 9:05 PM, the time of the crime?",
   opts:["No. The photos were taken at 9:14 and 9:17, so nothing shows where she was at 9:05","Yes. She was in photos, so she was in the ballroom all night","Yes. The booth is in the ballroom","No. Photos are never evidence"],a:0,
   hint:"Compare the real times of the photos with the real time of the crime.",
   explain:"Both photos were taken after the crime. Her alibi does not cover 9:05, so she is back in the picture."}
 ],
 reveal:{title:"Case note: a crack in an alibi",
  html:`<p>Penny’s alibi is solid. But Seraphina’s “perfect” alibi was an illusion caused by a slow clock. <b>Two suspects remain: Seraphina and Barnaby.</b></p>`,
  clear:[{id:"penny",why:"DJ log: at the ballroom screen at 9:04 and 9:06. The library trip takes too long."}],
  flag:[{id:"seraphina",why:"Her photo alibi falls apart. The booth clock runs 10 minutes slow, so the photos were at 9:14 and 9:17."}]},
 proof:"Penny tapped the ballroom screen at 9:04 and 9:06, so she was cleared. Seraphina’s photos looked like an alibi, but the booth clock was 10 minutes slow, so they were taken at 9:14 and 9:17."
},
{
 n:4, icon:"🧛", title:"The Witness", skill:"Matching clues",
 brief:`<p>Marisol was carrying a tray down the hallway at 9:06 PM by her phone’s correct clock. She did not think much of it then, but now she remembers a figure hurrying out of the library.</p>`,
 evidence:()=>`<div class="note"><b>Marisol’s statement:</b> “I saw someone leave the library in a hurry. They were taller than me. They wore a <b>long black cape with a high collar</b>. No hat.” <br><i>Marisol is 5 ft 8 in tall.</i></div>
 <div class="scroll"><table class="tbl"><tr><th>Suspect</th><th>Costume</th><th>Height</th></tr>
 <tr><td>Seraphina</td><td>Vampire: long black cape with a high collar, fangs, no hat</td><td>5 ft 10 in</td></tr>
 <tr><td>Barnaby</td><td>Mummy: white bandages from head to toe, no cape</td><td>5 ft 3 in</td></tr>
 <tr><td>Penny</td><td>Witch: black dress, tall pointed hat, broom</td><td>5 ft 5 in</td></tr>
 <tr><td>Rosie</td><td>Skeleton suit and an apron</td><td>5 ft 6 in</td></tr>
 <tr><td>Wyatt</td><td>Werewolf: fur mask and gloves</td><td>5 ft 11 in</td></tr></table></div>`,
 qs:[
  {q:"Which costume matches Marisol’s description: a long black cape with a high collar and no hat?",
   opts:["Vampire","Mummy","Witch","Skeleton"],a:0,
   hint:"Check the costume column. Which one has a cape and no hat?",
   explain:"Only the vampire costume has a long black cape with a high collar and no hat."},
  {q:"Marisol is 5 ft 8 in and said the person was taller than she is. Of the two suspects still on the board, Seraphina (5 ft 10 in) and Barnaby (5 ft 3 in), who fits?",
   opts:["Seraphina","Barnaby","Both fit","Neither fits"],a:0,
   hint:"Compare each suspect’s height with Marisol’s.",
   explain:"Seraphina is 2 inches taller than Marisol. Barnaby is 5 inches shorter."},
  {q:"Marisol saw the figure at 9:06 PM (correct clock). Does that fit with the time of the crime?",
   opts:["Yes. The crime was at 9:05, and she saw someone leave one minute later","No. The crime was at 9:15","No. She should have seen them at 9:20","Yes, but only if the library clock is trusted"],a:0,
   hint:"Use the real time of the crime you found at Station 1.",
   explain:"The crime was at 9:05. Seeing someone leave at 9:06 fits the timeline perfectly."}

const SKILLS_LIST=[
 ["Time logic","Working out the real time when a clock runs fast or slow"],
 ["Alibi math","Using distance and time to test whether someone could be somewhere"],
 ["Checking the clocks","Questioning evidence before trusting it"],
 ["Matching clues","Comparing a witness description with suspect details"],
 ["Code breaking","Decoding a secret message"],
 ["Motive logic","Finding who gained or lost from the crime"],
 ["Spotting the slip","Noticing when someone knows something they should not"]
];

/* ============================================================
   STATE
   ============================================================ */
const KEY="bluebonnet-manor-mystery-v1";
function fresh(){return {name:"",stage:"intro",st:0,qi:0,phase:"brief",misses:0,cleared:{},flags:{},done:0,cer:"",accused:[]}}
function load(){try{const j=localStorage.getItem(KEY);return j?Object.assign(fresh(),JSON.parse(j)):fresh()}catch(e){return fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
const shuf={};
const $=s=>document.querySelector(s);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function norm(t){return String(t).toUpperCase().replace(/[^A-Z]/g,"")}
function go(){save();render();window.scrollTo(0,0)}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  document.body.dataset.stage=S.stage;
  renderMeter();
  if(location.hash==="#key"){renderKey();$("#board").style.display="none";return}
  $("#board").style.display="";
  if(S.stage==="intro")renderIntro();
  else if(S.stage==="station")renderStation();
  else if(S.stage==="final")renderFinal();
  else renderSolved();
  renderBoard();
}
function renderMeter(){
  let dots="";
  for(let i=0;i<STATIONS.length;i++){
    dots+=`<i class="${i<S.done?"on":""} ${(S.stage==="station"&&i===S.st)?"now":""}" title="Station ${i+1}"></i>`;
  }
  $("#meter").innerHTML=`<div class="dots" role="img" aria-label="${S.done} of ${STATIONS.length} stations complete">${dots}</div>
  <span class="miss">Wrong answers: <b>${S.misses}</b></span>`;
}
function renderBoard(){
  let h=`<h2>Suspect board</h2>`;
  SUSPECTS.forEach(s=>{
    const c=S.cleared[s.id], f=S.flags[s.id];
    h+=`<div class="sus ${c?"cleared":""} ${(!c&&f&&f.length)?"prime":""}">
      ${c?`<span class="stamp">CLEARED</span>`:""}
      <b>${s.emoji} ${s.name}</b>
      <small>${s.role}. Says: ${s.claim}</small>
      ${c?`<span class="why">${c.why}</span>`:(f&&f.length?`<span class="why"><b>Looking guilty:</b> ${f.join(" ")}</span>`:`<span class="why">Still a suspect.</span>`)}
    </div>`;
  });
  $("#board").innerHTML=h;
}
function renderIntro(){
  const cards=SUSPECTS.map(s=>`<div class="card"><b>${s.emoji} ${s.name}</b><br><span>${s.role}</span><q>${s.say}</q></div>`).join("");
  $("#app").innerHTML=`<div class="paper">
    <h2>Case file: the last waltz at Bluebonnet Manor</h2>
    <p>It is Halloween night at <b>Bluebonnet Manor</b> in Calavera Springs, Texas. Every year, Ambrose Hollowell, the owner, throws a costume ball. This year, at <b>9:20 PM</b>, his maid Marisol found him in the library. The old library clock lay smashed on the floor.</p>
    <p>Sheriff Salazar locked the doors. Someone at this party did it, and the sheriff needs sharp detectives. There is no lab and no gadgets, just <b>time, logic, and clues</b>. Remember: <b>people can lie, and clocks can be wrong.</b></p>
    <div class="note sans"><b>How to solve it:</b> Visit seven evidence stations. At each one, answer the questions correctly to unlock the next piece of the case. You can try again, but wrong answers are counted. When you have all the evidence, make your accusation.</div>
    <h3>The suspects’ first statements</h3>
    <div class="cards">${cards}</div>
    <h3>Your detective name</h3>
    <label for="nm" class="sans" style="display:block;margin-bottom:6px">Type your name for your case report:</label>
    <input id="nm" type="text" maxlength="40" value="${esc(S.name)}" autocomplete="off">
    <div class="row"><button class="btn" id="start" type="button">Open the case</button></div>
  </div>`;
  $("#start").onclick=()=>{S.name=$("#nm").value.trim();S.stage="station";S.st=0;S.qi=0;S.phase="brief";go()};
}
function stationEvidence(st){
  if(!st.evidence)return "";
  const e=typeof st.evidence==="function"?st.evidence():st.evidence;
  return e?`<div class="evid">${e}</div>`:"";
}
function renderStation(){
  const st=STATIONS[S.st];
  const head=`<div class="paper"><h2>${st.icon} Station ${st.n}: ${st.title}</h2>
    <p class="sans" style="margin-top:0"><span class="tag">Skill: ${st.skill}</span></p>`;
  if(S.phase==="brief"){
    $("#app").innerHTML=`${head}${st.brief}${stationEvidence(st)}
      <div class="row"><button class="btn" id="go" type="button">Start the questions</button></div></div>`;
    $("#go").onclick=()=>{S.phase="q";S.qi=0;go()};
    return;
  }
  if(S.phase==="reveal"){renderReveal(st);return}
  renderQuestion(st,head);
}
function renderQuestion(st,head){
  const q=st.qs[S.qi];
  const key=S.st+"-"+S.qi;
  let body=`${head}${stationEvidence(st)}<hr style="border:0;border-top:2px solid #b9a97f;margin:18px 0">
    <div class="qhead"><span>Question ${S.qi+1} of ${st.qs.length}</span><span>Wrong answers so far: <b id="mc">${S.misses}</b></span></div>
    <div class="qtext">${q.q}</div>`;
  if(q.type==="text"){
    body+=`<div class="row" style="margin-top:0"><input id="ans" type="text" autocomplete="off" aria-label="Your answer" style="max-width:560px"><button class="btn" id="chk" type="button">Check my answer</button></div><div id="fb"></div></div>`;
    $("#app").innerHTML=body;
    const check=()=>{
      const v=$("#ans").value;
      if(!norm(v)){return}
      if(norm(v)===norm(q.answer)){$("#chk").disabled=true;$("#ans").disabled=true;correct(q,st)}
      else miss(q);
    };
    $("#chk").onclick=check;
    $("#ans").addEventListener("keydown",e=>{if(e.key==="Enter")check()});
    return;
  }
  if(!shuf[key])shuf[key]=shuffle(q.opts.map((t,i)=>({t,ok:i===q.a})));
  body+=`<div class="opts" id="opts">${shuf[key].map((o,i)=>`<button type="button" class="opt" data-i="${i}">${o.t}</button>`).join("")}</div><div id="fb"></div></div>`;
  $("#app").innerHTML=body;
  document.querySelectorAll("#opts .opt").forEach(b=>b.onclick=()=>{
    const o=shuf[key][+b.dataset.i];
    if(o.ok){
      b.classList.add("right");
      document.querySelectorAll("#opts .opt").forEach(x=>x.disabled=true);
      correct(q,st);
    }else{
      b.classList.add("wrong");b.disabled=true;miss(q);
    }
  });
}
function miss(q){
  S.misses++;save();
  $("#mc").textContent=S.misses;renderMeter();
  $("#fb").innerHTML=`<div class="feedback bad shake"><b>Not quite.</b> ${q.hint}</div>`;
}
function correct(q,st){
  const last=S.qi>=st.qs.length-1;
  $("#fb").innerHTML=`<div class="feedback good"><b>Correct!</b> ${q.explain}</div>
    <div class="row"><button class="btn" id="nx" type="button">${last?"Unlock the case note":"Next question"}</button></div>`;
  $("#nx").focus();
  $("#nx").onclick=()=>{
    if(last){applyReveal(st);S.phase="reveal";if(S.done<S.st+1)S.done=S.st+1}
    else S.qi++;
    go();
  };
}
function applyReveal(st){
  (st.reveal.clear||[]).forEach(c=>{S.cleared[c.id]={n:st.n,why:c.why}});
  (st.reveal.flag||[]).forEach(f=>{
    const a=S.flags[f.id]=Array.isArray(S.flags[f.id])?S.flags[f.id]:[];
    if(!a.includes(f.why))a.push(f.why);
  });
}
function renderReveal(st){
  const last=S.st>=STATIONS.length-1;
  $("#app").innerHTML=`<div class="paper"><h2>${st.icon} ${st.reveal.title}</h2>${st.reveal.html}
    <div class="row"><button class="btn" id="nx" type="button">${last?"Make your accusation":"Go to the next station"}</button></div></div>`;
  $("#nx").onclick=()=>{
    if(last){S.stage="final"}else{S.st++;S.qi=0;S.phase="brief"}
    go();
  };
}
let pickId=null;
function renderFinal(){
  pickId=null;
  $("#app").innerHTML=`<div class="paper"><h2>Make your accusation</h2>
    <p>You have seven pieces of evidence. Sheriff Salazar is waiting. Who was in the library at 9:05 PM?</p>
    <div class="pick" id="pick">${SUSPECTS.map(s=>`<button type="button" class="opt" aria-pressed="false" data-id="${s.id}">${s.emoji} ${s.name} <span style="color:#5a4d63">(${s.role})</span></button>`).join("")}</div>
    <div id="fb"></div>
    <div class="row"><button class="btn" id="acc" type="button" disabled>Accuse this suspect</button></div></div>`;
  document.querySelectorAll("#pick .opt").forEach(b=>b.onclick=()=>{
    pickId=b.dataset.id;
    document.querySelectorAll("#pick .opt").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
    $("#acc").disabled=false;
  });
  $("#acc").onclick=()=>{
    const pn=SUSPECTS.find(x=>x.id===pickId).name;
    (S.accused=S.accused||[]).push(pn);
    if(pickId==="seraphina"){S.stage="solved";go();return}
    S.misses++;save();renderMeter();
    const c=S.cleared[pickId];
    $("#fb").innerHTML=`<div class="feedback bad shake"><b>Not this one.</b> ${c?`Check the suspect board. This suspect was cleared at Station ${c.n}: ${c.why}`:"Look again at the evidence."}</div>`;
  };
}
function rank(){
  if(S.misses<=4)return "Chief Inspector";
  if(S.misses<=10)return "Lead Detective";
  return "Persistent Sleuth";
}
function renderSolved(){
  const proofs=STATIONS.map(s=>`<li><b>Station ${s.n} (${s.title}):</b> ${s.proof}</li>`).join("");
  $("#app").innerHTML=`<div class="paper"><h2>Case closed: Lady Seraphina Black did it</h2>
    <p>Faced with the evidence, Seraphina confessed. She had learned that Ambrose planned to sign a new will at 9:30. She wrote a threatening note and left it in his library. At 9:05 she slipped away from the ballroom, and the clock was smashed in the struggle. She hurried back, and the photo booth, running 10 minutes slow, made her alibi look perfect. Her one mistake was describing the library and the smashed clock before anyone had told her.</p>
    <p><b>Detective ${esc(S.name||"")}</b>, you finished with <b>${S.misses}</b> wrong answer${S.misses===1?"":"s"}. Your rank: <b>${rank()}</b>.</p>
    <h3>Your evidence file</h3><ul>${proofs}</ul>
    <h3>Write your case report</h3>
    <p class="sans" style="font-size:16px">Write a paragraph. <b>Claim:</b> who did it. <b>Clues:</b> use at least three pieces of evidence, with times, numbers, or exact details. <b>Logic:</b> explain why those clues, put together, can only point to one person.</p>
    <textarea id="cer" aria-label="Claim, clues, and logic">${esc(S.cer||"")}</textarea>
    <div id="cerPrint"></div>
    <div class="row"><button class="btn" id="prt" type="button">Print or save my report as a PDF</button></div>
    <div class="note sans"><b>Before you leave:</b> 1) Click <b>Download my case file</b> and save it (or turn it in as your teacher directs). 2) Then click <b>Finish and clear for the next detective</b>. This erases your name and answers from this computer so the next student can start fresh.</div>
    <div class="row"><button class="btn" id="dl" type="button">Download my case file</button><button class="btn ghost" id="fin" type="button" disabled>Finish and clear for the next detective</button></div>
    <div id="dlmsg" class="sans" style="margin-top:8px"></div>
    <h3>Detective skills used</h3>
    <div class="scroll"><table class="tbl">${SKILLS_LIST.map(t=>`<tr><td><b>${t[0]}</b></td><td>${t[1]}</td></tr>`).join("")}</table></div>
  </div>`;
  $("#cer").oninput=e=>{S.cer=e.target.value;save()};
  $("#prt").onclick=()=>{$("#cerPrint").textContent=$("#cer").value;window.print()};
  let downloaded=false;
  $("#dl").onclick=()=>{
    S.cer=$("#cer").value;save();
    downloadCase();downloaded=true;
    $("#fin").disabled=false;
    $("#dlmsg").innerHTML="<b>Downloaded.</b> Check your Downloads folder for your case file, then clear this computer.";
  };
  $("#fin").onclick=()=>{
    if(!downloaded){return}
    if(confirm("This erases your name, answers, and report from this computer. Did your case file download? Clear everything now?")){
      try{localStorage.removeItem(KEY)}catch(e){}
      S=fresh();Object.keys(shuf).forEach(k=>delete shuf[k]);
      if(location.hash)history.replaceState(null,"",location.pathname);
      go();
    }
  };
}
function downloadCase(){
  const name=S.name||"Detective";
  const acc=(S.accused&&S.accused.length)?S.accused:["Lady Seraphina Black"];
  const final=acc[acc.length-1];
  const wrong=acc.slice(0,-1);
  const when=new Date().toLocaleString();
  const proofs=STATIONS.map(s=>`<li><b>Station ${s.n} (${s.title}):</b> ${s.proof}</li>`).join("");
  const html=`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Case file: ${esc(name)}</title>
<style>body{font:17px/1.6 Georgia,serif;max-width:780px;margin:30px auto;padding:0 18px;color:#2b2233}h1{font-style:italic}h2{margin-top:1.4em;border-bottom:2px solid #b9a97f}.box{background:#f1e6cc;padding:12px 16px;border-radius:4px}pre{white-space:pre-wrap;font:inherit;background:#fffaf0;border:1px solid #b9a97f;padding:12px;border-radius:4px}</style></head><body>
<h1>The Last Waltz at Bluebonnet Manor: Case File</h1>
<div class="box"><p><b>Detective:</b> ${esc(name)}<br><b>Date completed:</b> ${esc(when)}<br><b>Rank:</b> ${rank()}<br><b>Wrong answers:</b> ${S.misses}</p>
<p><b>Who I think did it:</b> ${esc(final)}${wrong.length?`<br><b>Earlier wrong accusations:</b> ${esc(wrong.join(", "))}`:""}</p></div>
<h2>My evidence file</h2><ul>${proofs}</ul>
<h2>My claim, clues, and logic</h2><pre>${esc(S.cer||"(no report written)")}</pre>
<h2>Detective skills used</h2><ul>${SKILLS_LIST.map(t=>`<li><b>${t[0]}</b>: ${t[1]}</li>`).join("")}</ul>
</body></html>`;
  const blob=new Blob([html],{type:"text/html"});
  const a=document.createElement("a");
  const safe=name.replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"")||"Detective";
  a.href=URL.createObjectURL(blob);a.download="Bluebonnet-Manor-Case-"+safe+".html";
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function renderKey(){
  let h=`<div class="paper sans"><h2>Teacher answer key</h2>
  <p><b>Culprit:</b> Lady Seraphina Black. Clearing order: Rosie and Wyatt (Station 2), Penny (Station 3), Barnaby (Station 4). Seraphina’s photo-booth alibi breaks at Station 3, and Stations 4 to 7 build the case. Share the page address without “#key”.</p>`;
  STATIONS.forEach(s=>{
    h+=`<h3>Station ${s.n}: ${s.title} (${s.skill})</h3><ol>`;
    s.qs.forEach(q=>{
      const ans=q.type==="text"?q.answer:q.opts[q.a];
      h+=`<li>${q.q}<br><b>Answer:</b> ${ans}<br><i>${q.explain}</i></li>`;
    });
    h+=`</ol>`;
  });
  h+=`</div>`;
  $("#app").innerHTML=h;
}
$("#reset").onclick=()=>{
  if(confirm("Start a new case? This clears your saved progress on this computer.")){
    try{localStorage.removeItem(KEY)}catch(e){}
    S=fresh();if(location.hash)history.replaceState(null,"",location.pathname);go();
  }
};
window.addEventListener("hashchange",render);
render();
